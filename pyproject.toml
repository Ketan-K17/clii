[project]
name = "clii"
version = "0.2.3"
description = "Natural language terminal assistant for macOS"
requires-python = ">=3.11"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.2.25",
    "charset-normalizer==3.4.7",
    "distro==1.9.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "jiter==0.13.0",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "langchain-core==1.2.25",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.1.12",
    "langgraph==1.1.5",
    "langgraph-checkpoint==4.0.1",
    "langgraph-prebuilt==1.0.9",
    "langgraph-sdk==0.3.12",
    "langsmith==0.7.25",
    "openai==2.30.0",
    "orjson==3.11.8",
    "ormsgpack==1.12.2",
    "packaging==26.0",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "prompt_toolkit==3.0.53",
    "PyYAML==6.0.3",
    "python-decouple==3.8",
    "regex==2026.3.32",
    "requests==2.33.1",
    "requests-toolbelt==1.0.0",
    "sniffio==1.3.1",
    "tenacity==9.1.4",
    "tiktoken==0.12.0",
    "tqdm==4.67.3",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "urllib3==2.6.3",
    "uuid_utils==0.14.1",
    "xxhash==3.6.0",
    "zstandard==0.25.0",
]

[project.scripts]
clii = "clii.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clii*"]

[tool.setuptools.package-data]
clii = ["type_command.sh"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
